[package]
name = "taarof-sidebar"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "taarof agent-terminal sidebar — Zellij WASM plugin"

[dependencies]
zellij-tile = "0.43"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
