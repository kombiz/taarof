[package]
name = "agent-session-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
libc = "0.2"
rusqlite = { version = "0.31", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.8"

[features]
default = ["opencode-history"]
opencode-history = ["dep:rusqlite"]
bundled-sqlite = ["opencode-history", "rusqlite/bundled"]
