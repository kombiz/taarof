[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
]

# rusqlite 0.41's statement cache uses hashlink 0.12, which enables hashbrown's
# default hasher, foldhash. Allow its Zlib license for that one crate only.
[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
