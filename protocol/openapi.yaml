{
  "openapi": "3.1.0",
  "info": {
    "title": "Taarof remote protocol and local HTTP APIs",
    "version": "1.0.0",
    "license": { "name": "GPL-3.0-or-later" }
  },
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "servers": [
    {
      "url": "https://{tailnet-host}/remote",
      "variables": {
        "tailnet-host": {
          "default": "taarof.desktop.example.ts.net",
          "description": "Private tailnet HTTPS hostname. Public internet routing is out of scope."
        }
      }
    },
    {
      "url": "http://127.0.0.1:{port}",
      "description": "Shipped local HTTP server. Only operations marked x-taarof-surface: loopback-http run here.",
      "variables": {
        "port": {
          "default": "7800",
          "description": "Configured local HTTP port."
        }
      }
    }
  ],
  "security": [{ "TaarofSignedSession": [] }],
  "paths": {
    "/v1/negotiate": {
      "post": {
        "operationId": "negotiateProtocol",
        "summary": "Negotiate protocol version, neutral capabilities, and resource limits.",
        "security": [],
        "x-taarof-required-scopes": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/NegotiateRequest" },
              "examples": {
                "default": {
                  "value": {
                    "protocol_version": { "major": 1, "minor": 0 },
                    "capabilities": ["biometric_user_verification", "raw_pty", "runtime_mutation"],
                    "nonce": "11111111-1111-4111-8111-111111111111",
                    "deadline_ms": 4102444800000
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Negotiated protocol profile.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/NegotiateResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "429": { "$ref": "#/components/responses/RateLimited" }
        }
      }
    },
    "/v1/runtime": {
      "get": {
        "operationId": "getRuntimeState",
        "summary": "Read the configured runtime identity and high-level state.",
        "x-taarof-required-scopes": ["observe"],
        "responses": {
          "200": {
            "description": "Runtime state.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/RuntimeState" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "429": { "$ref": "#/components/responses/RateLimited" }
        }
      }
    },
    "/v1/navigation": {
      "get": {
        "operationId": "getNavigation",
        "summary": "Read workspace, tab, and pane navigation metadata.",
        "x-taarof-required-scopes": ["observe"],
        "responses": {
          "200": {
            "description": "Navigation tree.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/NavigationState" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "429": { "$ref": "#/components/responses/RateLimited" }
        }
      }
    },
    "/v1/navigation/selection": {
      "post": {
        "operationId": "selectPane",
        "summary": "Select the observed pane. Pane control is revoked when selection changes.",
        "x-taarof-required-scopes": ["observe"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/PaneSelectionRequest" }
            }
          }
        },
        "responses": {
          "204": { "description": "Pane selected." },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "429": { "$ref": "#/components/responses/RateLimited" }
        }
      }
    },
    "/v1/pairing/offers": {
      "post": {
        "operationId": "createPairingOffer",
        "summary": "Create a five-minute, one-use pairing offer from the owner host.",
        "security": [{ "OwnerHostLocal": [] }],
        "x-taarof-required-scopes": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreatePairingOfferRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Pairing offer.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/PairingOffer" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "429": { "$ref": "#/components/responses/RateLimited" }
        }
      }
    },
    "/v1/pairing/offers/{offer_id}/enroll": {
      "post": {
        "operationId": "enrollDesktopPairingOffer",
        "summary": "Submit a challenge-bound Linux desktop enrollment for local owner confirmation.",
        "security": [],
        "x-taarof-required-scopes": [],
        "parameters": [{ "$ref": "#/components/parameters/OfferId" }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/DesktopEnrollmentRequest" }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Enrollment verified and pending owner-host confirmation.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/PendingDevice" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "429": { "$ref": "#/components/responses/RateLimited" }
        }
      }
    },
    "/v1/pairing/offers/{offer_id}/confirm": {
      "post": {
        "operationId": "confirmPairingOffer",
        "summary": "Confirm a pending paired device after local operator review.",
        "security": [{ "OwnerHostLocal": [] }],
        "x-taarof-required-scopes": [],
        "parameters": [{ "$ref": "#/components/parameters/OfferId" }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ConfirmPairingRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Device enrolled.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Device" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/pairing/offers/{offer_id}/reject": {
      "post": {
        "operationId": "rejectPairingOffer",
        "summary": "Reject a pending pairing offer.",
        "security": [{ "OwnerHostLocal": [] }],
        "x-taarof-required-scopes": [],
        "parameters": [{ "$ref": "#/components/parameters/OfferId" }],
        "responses": {
          "204": { "description": "Offer rejected." },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/devices": {
      "get": {
        "operationId": "listDevices",
        "summary": "List paired devices and revocation state.",
        "security": [{ "OwnerHostLocal": [] }],
        "x-taarof-required-scopes": [],
        "responses": {
          "200": {
            "description": "Devices.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["devices"],
                  "properties": {
                    "devices": {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Device" }
                    }
                  }
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/v1/devices/{device_id}": {
      "delete": {
        "operationId": "revokeDevice",
        "summary": "Revoke a paired device and close live grants.",
        "security": [{ "OwnerHostLocal": [] }],
        "x-taarof-required-scopes": [],
        "parameters": [{ "$ref": "#/components/parameters/DeviceId" }],
        "responses": {
          "204": { "description": "Device revoked." },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/observe-sessions": {
      "post": {
        "operationId": "createObserveSession",
        "summary": "Create a renewable observe session lasting at most one hour.",
        "x-taarof-required-scopes": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateObserveSessionRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Observe session.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ObserveSession" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "429": { "$ref": "#/components/responses/RateLimited" }
        }
      }
    },
    "/v1/observe-sessions/{observe_session_id}": {
      "delete": {
        "operationId": "closeObserveSession",
        "summary": "Close an observe session and any dependent control grants.",
        "x-taarof-required-scopes": ["observe"],
        "parameters": [{ "$ref": "#/components/parameters/ObserveSessionId" }],
        "responses": {
          "204": { "description": "Observe session closed." },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/control-sessions": {
      "post": {
        "operationId": "createControlSession",
        "summary": "Create pane-control or five-minute runtime-mutation control after user verification.",
        "x-taarof-required-scopes": ["observe"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateControlSessionRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Control session.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ControlSession" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "429": { "$ref": "#/components/responses/RateLimited" }
        }
      }
    },
    "/v1/control-sessions/{control_session_id}": {
      "delete": {
        "operationId": "closeControlSession",
        "summary": "Relinquish a control session.",
        "x-taarof-required-scopes": ["pane-control", "runtime-mutation"],
        "parameters": [{ "$ref": "#/components/parameters/ControlSessionId" }],
        "responses": {
          "204": { "description": "Control session closed." },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/v1/tabs": {
      "post": {
        "operationId": "createTab",
        "summary": "Create a runtime-bound tab.",
        "x-taarof-required-scopes": ["runtime-mutation"],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateTabRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created tab.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Tab" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "429": { "$ref": "#/components/responses/RateLimited" }
        }
      }
    },
    "/v1/tabs/{tab_id}/panes/{pane_id}/splits": {
      "post": {
        "operationId": "createSplit",
        "summary": "Create a split from a target pane.",
        "x-taarof-required-scopes": ["runtime-mutation", "pane-control"],
        "parameters": [
          { "$ref": "#/components/parameters/TabId" },
          { "$ref": "#/components/parameters/PaneId" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateSplitRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created split pane.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Pane" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "429": { "$ref": "#/components/responses/RateLimited" }
        }
      }
    },
    "/health": {
      "get": {
        "operationId": "getLoopbackHealth",
        "summary": "Read unauthenticated local runtime health.",
        "security": [],
        "x-taarof-surface": "loopback-http",
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackHealth" },
          "500": { "$ref": "#/components/responses/LoopbackJsonError" },
          "503": { "$ref": "#/components/responses/LoopbackJsonError" },
          "504": { "$ref": "#/components/responses/LoopbackJsonError" }
        }
      }
    },
    "/api/v1/runtime-identity": {
      "get": {
        "operationId": "getLoopbackRuntimeIdentity",
        "summary": "Read the local HTTP-router runtime identity.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackRuntimeIdentity" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" }
        }
      }
    },
    "/api/v1/state": {
      "get": {
        "operationId": "getLoopbackState",
        "summary": "Read the full local state snapshot.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackState" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" },
          "500": { "$ref": "#/components/responses/LoopbackInternalError" },
          "503": { "$ref": "#/components/responses/LoopbackUnavailable" },
          "504": { "$ref": "#/components/responses/LoopbackGatewayTimeout" }
        }
      }
    },
    "/api/v1/agent-sessions": {
      "get": {
        "operationId": "getLoopbackAgentSessions",
        "summary": "Read the agent-session catalog (v1 by default, v2 opt-in).",
        "parameters": [{ "name": "schema", "in": "query", "required": false, "schema": { "type": "string", "enum": ["taarof.agent-sessions.v1", "agent.sessions.v2"], "default": "taarof.agent-sessions.v1" } }],
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackAgentSessions" },
          "400": { "$ref": "#/components/responses/LoopbackRequestError" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" },
          "500": { "$ref": "#/components/responses/LoopbackInternalError" },
          "503": { "$ref": "#/components/responses/LoopbackUnavailable" },
          "504": { "$ref": "#/components/responses/LoopbackGatewayTimeout" }
        }
      }
    },
    "/api/v1/sessions": {
      "get": {
        "operationId": "getLoopbackSessions",
        "summary": "Read local session and dashboard metadata.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackSessions" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" },
          "500": { "$ref": "#/components/responses/LoopbackInternalError" },
          "503": { "$ref": "#/components/responses/LoopbackUnavailable" },
          "504": { "$ref": "#/components/responses/LoopbackGatewayTimeout" }
        }
      }
    },
    "/api/v1/workspaces": {
      "get": {
        "operationId": "getLoopbackWorkspaces",
        "summary": "Read the local workspace projection.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackWorkspaces" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" },
          "500": { "$ref": "#/components/responses/LoopbackInternalError" },
          "503": { "$ref": "#/components/responses/LoopbackUnavailable" },
          "504": { "$ref": "#/components/responses/LoopbackGatewayTimeout" }
        }
      }
    },
    "/api/v1/tabs": {
      "get": {
        "operationId": "getLoopbackTabs",
        "summary": "Read the local tab projection.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackTabs" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" },
          "500": { "$ref": "#/components/responses/LoopbackInternalError" },
          "503": { "$ref": "#/components/responses/LoopbackUnavailable" },
          "504": { "$ref": "#/components/responses/LoopbackGatewayTimeout" }
        }
      }
    },
    "/api/v1/panes": {
      "get": {
        "operationId": "getLoopbackPanes",
        "summary": "Read the local pane projection.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackPanes" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" },
          "500": { "$ref": "#/components/responses/LoopbackInternalError" },
          "503": { "$ref": "#/components/responses/LoopbackUnavailable" },
          "504": { "$ref": "#/components/responses/LoopbackGatewayTimeout" }
        }
      }
    },
    "/api/v1/file-preview": {
      "get": {
        "operationId": "getLoopbackFilePreview",
        "summary": "Read a bounded local-pane file preview.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "parameters": [
          { "$ref": "#/components/parameters/LoopbackFileTab" },
          { "$ref": "#/components/parameters/LoopbackFilePane" },
          { "$ref": "#/components/parameters/LoopbackFilePath" },
          { "$ref": "#/components/parameters/LoopbackFileLine" },
          { "$ref": "#/components/parameters/LoopbackFileColumn" }
        ],
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackFilePreview" },
          "400": { "$ref": "#/components/responses/LoopbackRequestError" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" },
          "403": { "$ref": "#/components/responses/LoopbackJsonError" },
          "404": { "$ref": "#/components/responses/LoopbackJsonError" },
          "413": { "$ref": "#/components/responses/LoopbackJsonError" },
          "415": { "$ref": "#/components/responses/LoopbackJsonError" },
          "500": { "$ref": "#/components/responses/LoopbackInternalError" },
          "503": { "$ref": "#/components/responses/LoopbackUnavailable" },
          "504": { "$ref": "#/components/responses/LoopbackGatewayTimeout" }
        }
      }
    },
    "/api/v1/file-stat": {
      "get": {
        "operationId": "getLoopbackFileStat",
        "summary": "Read metadata for a local-pane file without reading contents. line and col are accepted by the shared Rust query extractor but ignored.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "parameters": [
          { "$ref": "#/components/parameters/LoopbackFileTab" },
          { "$ref": "#/components/parameters/LoopbackFilePane" },
          { "$ref": "#/components/parameters/LoopbackFilePath" },
          { "$ref": "#/components/parameters/LoopbackFileLine" },
          { "$ref": "#/components/parameters/LoopbackFileColumn" }
        ],
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackFileStat" },
          "400": { "$ref": "#/components/responses/LoopbackRequestError" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" },
          "403": { "$ref": "#/components/responses/LoopbackJsonError" },
          "404": { "$ref": "#/components/responses/LoopbackJsonError" },
          "413": { "$ref": "#/components/responses/LoopbackJsonError" },
          "415": { "$ref": "#/components/responses/LoopbackJsonError" },
          "500": { "$ref": "#/components/responses/LoopbackInternalError" },
          "503": { "$ref": "#/components/responses/LoopbackUnavailable" },
          "504": { "$ref": "#/components/responses/LoopbackGatewayTimeout" }
        }
      }
    },
    "/api/v1/control/send-keys": {
      "post": {
        "operationId": "sendLoopbackKeys",
        "summary": "Send raw keys to a local pane through the socket control path.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "x-taarof-loopback-control": true,
        "requestBody": { "$ref": "#/components/requestBodies/LoopbackSendKeys" },
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackSendKeys" },
          "400": { "$ref": "#/components/responses/LoopbackRequestError" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" },
          "403": { "$ref": "#/components/responses/LoopbackForbidden" },
          "415": { "$ref": "#/components/responses/LoopbackPlainTextError" },
          "422": { "$ref": "#/components/responses/LoopbackPlainTextError" },
          "500": { "$ref": "#/components/responses/LoopbackInternalError" },
          "503": { "$ref": "#/components/responses/LoopbackUnavailable" },
          "504": { "$ref": "#/components/responses/LoopbackGatewayTimeout" }
        }
      }
    },
    "/api/v1/control/run-in-pane": {
      "post": {
        "operationId": "runLoopbackCommandInPane",
        "summary": "Run a command in a local pane through the socket control path.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "x-taarof-loopback-control": true,
        "requestBody": { "$ref": "#/components/requestBodies/LoopbackRunInPane" },
        "responses": {
          "200": { "$ref": "#/components/responses/LoopbackRunInPane" },
          "400": { "$ref": "#/components/responses/LoopbackRequestError" },
          "401": { "$ref": "#/components/responses/LoopbackUnauthorized" },
          "403": { "$ref": "#/components/responses/LoopbackForbidden" },
          "415": { "$ref": "#/components/responses/LoopbackPlainTextError" },
          "422": { "$ref": "#/components/responses/LoopbackPlainTextError" },
          "500": { "$ref": "#/components/responses/LoopbackInternalError" },
          "503": { "$ref": "#/components/responses/LoopbackUnavailable" },
          "504": { "$ref": "#/components/responses/LoopbackGatewayTimeout" }
        }
      }
    },
    "/api/v1/control/switch-tab": {
      "post": {
        "operationId": "switchLoopbackTab",
        "summary": "Focus a local tab through the socket control path.",
        "security": [{ "TaarofLoopbackBearer": [] }],
        "x-taarof-surface": "loopback-http",
        "x-taarof-loopback-control": true,
        "requestBody": { "$ref": "#/components/requestBodies/LoopbackSwitchTab" },
