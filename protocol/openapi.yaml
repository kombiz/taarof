        "bearerFormat": "per-process opaque token",
        "description": "Default authentication for every protected loopback HTTP operation, including WebSocket handshakes. The per-process token is stored in a mode-0600 file in the private runtime directory. It authenticates local HTTP observation and, only with the separate loopback control gate, the marked mutating subset."
      },
      "TaarofLoopbackWebSocketToken": {
        "type": "apiKey",
        "in": "query",
        "name": "token",
        "description": "WebSocket-handshake-only alternative to the default Authorization: Bearer token. This exists for browser WebSocket clients, which cannot set arbitrary headers; it does not authenticate REST requests and does not relax the loopback or http_control gates."
