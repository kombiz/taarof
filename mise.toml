# Public contributor tasks for taarof.
# Rust is managed with rustup; Node is managed by mise when available.

[tools]
node = "lts"

[tasks.setup]
description = "Fetch/install dependencies for app + web client"
run = [
  "cargo fetch --manifest-path agent-launcher/Cargo.toml",
  "cargo fetch --manifest-path taarof-app/Cargo.toml",
  "npm --prefix taarof-web ci",
  "npm --prefix taarof-web run build",
]

[tasks.dev]
description = "Run taarof in debug mode"
run = "cargo run --manifest-path taarof-app/Cargo.toml"

[tasks.build]
description = "Build the release binary"
run = [
  "cargo build --release --manifest-path agent-launcher/Cargo.toml",
  "cargo build --release --manifest-path taarof-app/Cargo.toml",
]

[tasks.install]
description = "Install origin/main (default) or origin/kmux as separate desktop apps"
usage = '''
arg "[channel]" default="main" help="Public source branch" {
  choices "main" "kmux"
}
flag "--prefix <prefix>" help="Installation prefix (default: ~/.local)"
'''
run = 'python3 packaging/linux/install-channel.py "$usage_channel" --prefix "${usage_prefix:-$HOME/.local}"'

[tasks."install:checkout"]
description = "Build and install this checkout under an explicit prefix (developer packaging)"
depends = ["build", "web:build"]
run = [
  'bash packaging/linux/emit-artifact-provenance.sh "${CARGO_TARGET_DIR:-taarof-app/target}/release/taarof-app"',
  "bash packaging/linux/install-local.sh",
]

[tasks."web:build"]
description = "Build the web client bundle"
run = [
  "npm --prefix taarof-web ci",
  "npm --prefix taarof-web run build",
]

[tasks.lint]
description = "Check Rust formatting and fail on clippy warnings"
run = [
  "cargo fmt --manifest-path agent-session-core/Cargo.toml --check",
  "cargo clippy --manifest-path agent-session-core/Cargo.toml --all-targets --all-features -- -D warnings",
  "cargo fmt --manifest-path agent-launcher/Cargo.toml --check",
  "cargo clippy --manifest-path agent-launcher/Cargo.toml --all-targets -- -D warnings",
  "cargo fmt --manifest-path taarof-app/Cargo.toml --all --check",
  "cargo fmt --manifest-path wasm-sidebar/Cargo.toml --all --check",
  "cargo clippy --manifest-path taarof-app/Cargo.toml --all-targets -- -D warnings",
]

[tasks.typecheck]
description = "Compile-check the app and TypeScript client"
run = [
  "cargo check --manifest-path taarof-app/Cargo.toml --all-targets",
  "cargo check --manifest-path taarof-app/Cargo.toml --example performance_harness --features harness",
  "cargo check --manifest-path taarof-app/Cargo.toml --no-default-features",
  "npm --prefix taarof-web run build",
]

[tasks.performance]
description = "Run and validate the reproducible release performance workloads"
run = [
  "python3 testing/test_performance_baseline.py",
  "cargo build --release --manifest-path taarof-app/Cargo.toml --example performance_harness --features harness",
  "cargo test --manifest-path taarof-app/Cargo.toml --features harness --lib performance::",
  'python3 testing/record-performance-baseline.py --binary "${CARGO_TARGET_DIR:-taarof-app/target}/release/examples/performance_harness" --output "${PERFORMANCE_BASELINE_OUTPUT:-taarof-app/target/performance-baseline.json}"',
]

[tasks.test]
depends = ["web:build"]
description = "Run app and web tests"
run = [
  "cargo test --manifest-path agent-session-core/Cargo.toml",
  "cargo test --manifest-path agent-session-core/Cargo.toml --no-default-features",
  "cargo test --manifest-path agent-launcher/Cargo.toml",
  "python3 testing/test_bundle_provenance.py",
  "python3 testing/test_install_channel.py",
  "cargo test --manifest-path taarof-app/Cargo.toml",
  "python3 taarof-cli/test_taarof_cli.py",
  "npm --prefix taarof-web test",
  "python3 testing/test_http_contract_docs.py",
  "python3 testing/test_shell_integration.py",
]

[tasks."wasm:build"]
description = "Build the experimental WASM sidebar"
run = 'cargo build --manifest-path wasm-sidebar/Cargo.toml --target wasm32-wasip1 --target-dir "${CARGO_TARGET_DIR:-wasm-sidebar/target}"'

[tasks."package:validate"]
description = "Validate the local Linux package and release tarball"
run = "bash packaging/linux/validate-local-install.sh"

[tasks."release:scan"]
description = "Scan the release tree for vulnerable dependencies and leaked secrets"
run = [
  "gitleaks dir --redact .",
  "cargo audit --file Cargo.lock --target-os linux",
  "cargo deny --manifest-path taarof-app/Cargo.toml check",
  "npm --prefix taarof-web audit --omit=dev",
  "osv-scanner scan source --lockfile Cargo.lock --lockfile taarof-web/package-lock.json",
]

[tasks.ci]
description = "Run the public contributor quality gate in a deterministic order"
run = [
  "mise run setup",
  "mise run lint",
  "mise run typecheck",
  "mise run performance",
  "mise run test",
  "mise run package:validate",
]
