[package]
name = "agent-launcher"
version = "0.1.0"
edition = "2021"
# Share the desktop provenance implementation; this script has no GTK dependency.
build = "../taarof-app/build.rs"
license = "MIT OR Apache-2.0"

[dependencies]
agent-session-core = { version = "0.1.0", path = "../agent-session-core" }
libc = "0.2.189"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
socket2 = "0.6.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "agent"
path = "src/main.rs"
